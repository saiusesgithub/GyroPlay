name: Build Android APK

on:
  push:
    branches:
      - "**"
    paths:
      - "mobile/flutter_app/**"
      - ".github/workflows/build-android-apk.yml"

  pull_request:
    branches:
      - main
    paths:
      - "mobile/flutter_app/**"
      - ".github/workflows/build-android-apk.yml"

  workflow_dispatch:

jobs:
  build-apk:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/GyroPlay-arm64-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GyroPlay-arm64-${{ github.run_number }}
          path: mobile/flutter_app/build/app/outputs/flutter-apk/GyroPlay-arm64-${{ github.run_number }}.apk
          retention-days: 14
          if-no-files-found: error