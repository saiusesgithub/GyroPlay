name: Build Android APK

on:
  push:
    branches:
      - "**"
    paths:
      - "mobile/flutter_app/**"
      - ".github/workflows/build-android-apk.yml"

  pull_request:
    branches:
      - main
    paths:
      - "mobile/flutter_app/**"
      - ".github/workflows/build-android-apk.yml"

  workflow_dispatch:

concurrency:
  group: gyroplay-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ARM64 APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile/flutter_app/android/*.gradle*
            mobile/flutter_app/android/**/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT is not set."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            find "$SDK_ROOT" -maxdepth 3 -type f -name sdkmanager -print
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/GyroPlay-arm64-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GyroPlay-arm64-${{ github.run_number }}
          path: mobile/flutter_app/build/app/outputs/flutter-apk/GyroPlay-arm64-${{ github.run_number }}.apk
          retention-days: 14
          if-no-files-found: error
